spring.application.name=SpringEcom

# spring.datasource.url=jdbc:postgresql://localhost:5432/telusko
# spring.datasource.username=postgres
# spring.datasource.password=0076

spring.docker.compose.lifecycle-management=start-only

spring.jpa.hibernate.ddl-auto=update

# Set max file size for single file upload (e.g., 100MB)
spring.servlet.multipart.max-file-size=100MB
# Set max request size for total upload (e.g., multiple files in a single request)
spring.servlet.multipart.max-request-size=100MB

# Gemini API Key (reads from system environment variable, with fallback)
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}

# Model options
spring.ai.google.genai.chat.options.model=gemini-3.5-flash-lite
spring.ai.google.genai.chat.options.temperature=0.7

spring.ai.google.genai.image.options.model=imagen-3.0-generate-002
spring.ai.google.genai.image.options.aspect-ratio=1:1

spring.sql.init.schema-locations=classpath:init/schema.sql
spring.sql.init.mode=never

# Embedding Model options
spring.ai.google.genai.embedding.options.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.options.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.options.dimensions=768
spring.main.allow-bean-definition-overriding=true
# remove the exclude line, and add:
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
