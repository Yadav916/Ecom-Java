spring.application.name=SpringEcom

spring.datasource.url=jdbc:postgresql://localhost:5432/ecom
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update

# Set max file size for single file upload (e.g., 100MB)
spring.servlet.multipart.max-file-size=100MB
# Set max request size for total upload (e.g., multiple files in a single request)
spring.servlet.multipart.max-request-size=100MB

spring.application.name=gemini-spring-app

# Gemini API Key (reads from system environment variable, with a fallback or direct entry)
spring.ai.google.genai.api-key=${GOOGLE_API_KEY}

# Model options
spring.ai.google.genai.chat.options.model=gemini-3.8-flash
spring.ai.google.genai.chat.options.temperature=0.7

spring.ai.google.genai.image.options.model=imagen-3.0-generate-002
spring.ai.google.genai.image.options.aspect-ratio=1:1